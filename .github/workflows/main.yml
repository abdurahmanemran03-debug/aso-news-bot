name: ASO NEWS Auto Publisher

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          pip install requests feedparser pillow google-genai

      - name: Run ASO NEWS
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python main.py

      - name: Save history
        run: |
          git config user.name "ASO NEWS Bot"
          git config user.email "aso-news-bot@users.noreply.github.com"

          git add posted_news.json

          git diff --cached --quiet || git commit -m "Update posted news history"

          git push
